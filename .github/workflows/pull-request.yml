name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  staging-only:
    name: Staging only
    runs-on: ubuntu-latest
    steps:
      - name: Require staging as the source branch
        run: test "${{ github.head_ref }}" = "staging"
